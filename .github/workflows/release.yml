name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - run: go test ./...
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            relayforge_os=${target%/*}
            relayforge_arch=${target#*/}
            package=relayforge_${VERSION#v}_${relayforge_os}_${relayforge_arch}
            mkdir -p "dist/$package"
            CGO_ENABLED=0 GOOS=$relayforge_os GOARCH=$relayforge_arch go build -trimpath -ldflags="-s -w -X github.com/Unn0ne/relayforge/internal/buildinfo.Version=$VERSION -X github.com/Unn0ne/relayforge/internal/buildinfo.Commit=$COMMIT -X github.com/Unn0ne/relayforge/internal/buildinfo.BuiltAt=$build_date" -o "dist/$package/relayforge" ./cmd/relayforge
            cp LICENSE README.md "dist/$package/"
            tar -C dist -czf "dist/$package.tar.gz" "$package"
            rm -r "dist/$package"
          done
          cd dist
          sha256sum *.tar.gz > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
